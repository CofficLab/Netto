name: Pro Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: 更新版本号
        run: |
          # 读取配置文件路径（Xcode 16 工程格式：project.xcproj）
          projectFile=$(find "$(pwd)" ! -path "*Resources*" -type f -name "project.xcproj" | head -n 1)
          if [[ -z "$projectFile" ]]; then
            echo "未找到 project.xcproj"
            exit 1
          fi
          echo "项目文件: $projectFile"

          oldVersion=$(grep -Eo '"MARKETING_VERSION": "[0-9]+\.[0-9]+\.[0-9]+"' "$projectFile" \
            | head -n 1 | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')
          # 根据自上一个 v* 标签以来的 Conventional Commits 决定 major/minor/patch
          newVersion=$(bash .github/scripts/next-version.sh)
          echo "版本号: $oldVersion -> $newVersion"

          NEW_VERSION="$newVersion" perl -i -pe \
            's/"MARKETING_VERSION": "\d+\.\d+\.\d+"/"MARKETING_VERSION": "$ENV{NEW_VERSION}"/' \
            "$projectFile"

          # 显示更新后的版本号
          echo "=== 更新后的版本号 ==="
          grep -n "MARKETING_VERSION" "$projectFile"

          echo "version=$newVersion" >> $GITHUB_ENV

          git status
      - name: 生成标签
        run: |
          version="${{ env.version }}"
          if [[ -z "$version" ]]; then
            echo "版本号为空"
            exit 1
          fi

          echo "主应用版本号: $version"
          echo "tag=v$version" >> $GITHUB_ENV
      - name: 打标签并推送到仓库
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: '🎨 Bump a new version'
          commit_user_name: GitHub Action
          tagging_message: ${{ env.tag }}
  sync_dev:
    if: github.ref == 'refs/heads/main'
    needs:
      - bump
    runs-on: ubuntu-latest
    steps:
      - name: 检出 dev 分支
        uses: actions/checkout@v3
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: 拉取 main 最新提交
        run: git fetch origin main
      - name: 合并 main 到 dev
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"
          git merge --no-edit origin/main || true
      - name: 推送 dev 分支
        run: git push origin dev
