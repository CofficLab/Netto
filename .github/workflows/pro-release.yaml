name: Pro Release

on:
  push:
    tags:
      - '*v'
  workflow_run:
    workflows:
      - 'Pro Bump'
    types:
      - completed

permissions:
  contents: write

env:
  tag: '-'

jobs:
  release:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: 读取版本号
        run: |
          # 读取配置文件路径（Xcode 16 工程格式：project.xcproj）
          projectFile=$(find "$(pwd)" -type f -name "project.xcproj" | head -n 1)
          if [[ -z "$projectFile" ]]; then
            echo "未找到 project.xcproj"
            exit 1
          fi

          # 读取文件中的版本号
          version=$(grep -Eo '"MARKETING_VERSION": "[0-9]+\.[0-9]+\.[0-9]+"' "$projectFile" | head -n 1 | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')
          if [[ -z "$version" ]]; then
            echo "未能解析 MARKETING_VERSION"
            exit 1
          fi

          echo "版本号->$version"

          echo "tag=v$version" >> $GITHUB_ENV
      - name: Generate Changelog
        run: echo ""> ${{ github.workspace }}-CHANGELOG.txt
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.tag }}
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          files: |
            ./**/*.dmg
            ./**/*.zip
            ./**/*.exe
            ./**/*.pkg
            ./**/*.deb
            ./**/*.ipa
            ./**/*.AppImage
            ./**/*.snap
